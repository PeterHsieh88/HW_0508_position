<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定位練習 3</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        width: 300px;
        border: 1px solid gray;
        border-radius: 0px 0px 10px 10px;
      }

      .card-img {
        position: relative;
        /* 固定圖片區塊高度 */
        height: 200px;
        overflow: hidden; /* 超出的圖片裁掉 */
      }

      .card-img img {
        width: 100%;
        /* 撐滿整個 card-img */
        height: 100%;
        object-fit: cover; /* 等比例裁切，不變形 */
        display: block;
      }

      .hot-icon {
        background-color: red;
        color: white;
        font-size: 24px;
        width: 50px;
        height: 50px;
        position: absolute;
        right: 0;
        top: 0;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card-title {
        font-size: 24px;
        font-weight: 600;
        padding: 0px 0px 0px 10px;
      }
      .card-content {
        font-size: 14px;
        padding: 10px 10px 100px 10px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-img">
        <img src="https://picsum.photos/300/200/?random=10" />
        <div class="hot-icon">hot</div>
      </div>
      <div class="card-title">卡片標題</div>
      <div class="card-content">
        這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容這是卡片的內容
      </div>
    </div>
  </body>
</html>
